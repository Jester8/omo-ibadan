<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E1B3A">
<title>Omo Ibadan · offline</title>
<style>
  html,body{height:100%;margin:0}
  body{display:grid;place-items:center;background:linear-gradient(#1b1a2e,#7a3b22);color:#fff;font-family:system-ui,sans-serif;text-align:center;padding:24px}
  img{width:96px;height:96px}
  h1{margin:16px 0 6px;font-size:28px}
  p{margin:0 0 20px;opacity:.8}
  button{border:0;border-radius:999px;padding:14px 28px;font-weight:700;font-size:16px;background:#fff;color:#1b1a2e}
</style>
</head>
<body>
  <main>
    <img src="/logo.png" alt="">
    <h1>You are offline</h1>
    <p>Omo Ibadan needs a connection to load. Check your network and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
